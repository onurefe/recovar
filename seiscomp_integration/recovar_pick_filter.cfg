# recovar_pick_filter.cfg
# Place in $SEISCOMP_ROOT/etc/  (or pass --config-file on the command line)
#
# The module subscribes to the PICK messaging group, scores every incoming
# pick with the recovar ensemble, and attaches the result as a comment:
#   text = "recovar_score:0.8734"
# The score is in [0, 1]: 1 = high confidence seismic signal, 0 = noise.

# ---- Required --------------------------------------------------------

# Path to the pre-trained weights file distributed with recovar.
# Typically: <repo>/models/representation_cross_covariances.h5
recovar.modelPath = /path/to/recovar/models/representation_cross_covariances.h5

# Waveform source used to fetch 30-second windows around each pick.
# SeisComP record stream URL — examples:
#   SeedLink:  slink://localhost:18000
#   SDS:       sdsarchive:///data/sds
#   FDSN:      fdsnws://service.iris.edu/fdsnws/dataselect/1/query
recordStream = slink://localhost:18000

# ---- Optional --------------------------------------------------------

# SeisComP messaging host (default: localhost)
# messaging.hostname = localhost

# Agency ID written into the comment CreationInfo.
# agencyID = MY_AGENCY
